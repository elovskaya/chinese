<style>
:root{color-scheme:light dark;--bg:light-dark(#f3f7fc,#0b1430);--ink:light-dark(#0f2350,#e4ebf8);--mut:light-dark(#4f5f7d,#9fb0cf);--deep:#1b3a73;--card:light-dark(#ffffff,#0f1b3e);--line:light-dark(#c6d4ea,#2a3e72);--acc:light-dark(#f6cd6b,#e9c46a);--acct:light-dark(#9a6800,#e9c46a)}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Golos Text",system-ui,sans-serif}

.n{width:40px;height:40px;border-radius:10px;background:var(--acc);color:#0f2350;display:grid;place-items:center;font-weight:700}
.t{font-family:"Noto Serif SC",serif;font-size:24px;line-height:1.2}
.d{color:var(--mut);font-size:15px}
.go{color:var(--acct);font-weight:600;font-size:15px}
.small{color:var(--mut);font-size:14px;margin-top:28px}
